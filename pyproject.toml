[project]
name = "RPyG"
version = "3.0.0"
requires-python = ">=3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rpyg = "RPyG.launch:launch_game"

[tool.ruff]
target-version = "py314"
line-length = 88 # 88 for formatting: 120 for comments, doc strings, etc
exclude = [".venv", ".git", "__pycache__",]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Enable isort rules for import sorting
select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.pyright]
reportAny = false
reportImportCycles = false

[tool.typos]
[tool.typos.default.extend-words]
RPyG = "RPyG"
Debina ="Debina" # Name Of A town
